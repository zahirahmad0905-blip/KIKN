<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS Batas Wilayah KIKN</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        
        /* Peta menutupi seluruh layar */
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1;
        }

        /* Panel UI agar berada di atas peta */
        .ui-overlay {
            z-index: 1000;
        }
    </style>
</head>
<body class="overflow-hidden bg-slate-900">

    <!-- Container Peta -->
    <div id="map"></div>

    <!-- Panel Informasi (Kiri Atas) -->
    <div class="ui-overlay absolute top-4 left-4 right-4 md:right-auto md:w-96">
        <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-5 border border-slate-200/50">
            <div class="flex items-center gap-3 mb-2">
                <div class="bg-amber-500 text-white p-2.5 rounded-lg shadow-sm">
                    <i class="fa-solid fa-map-location-dot text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-800 leading-tight">Batas Wilayah KIKN</h1>
                    <p class="text-xs text-slate-500 font-medium tracking-wide uppercase mt-0.5">Peta Citra Satelit</p>
                </div>
            </div>
            <p class="text-sm text-slate-600 mt-4 border-t border-slate-100 pt-3 leading-relaxed">
                Visualisasi interaktif batas wilayah Kawasan Inti Pusat Pemerintahan (KIKN) Nusantara.
            </p>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // 1. Inisialisasi Peta
        const map = L.map('map', {
            zoomControl: false // Kita pindahkan tombol zoom
        }).setView([-0.81, 116.76], 11);

        // Pindahkan tombol zoom ke kanan bawah
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 2. Tambahkan Skala Peta (Kiri Bawah)
        L.control.scale({ metric: true, imperial: false, position: 'bottomleft' }).addTo(map);

        // 3. Definisikan Beberapa Pilihan Basemap
        const satelitEsri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxNativeZoom: 17, // SOLUSI ZOOM: Batas gambar server, sisanya akan di-stretch
            maxZoom: 19
        });

        const petaJalan = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        });

        // Tampilkan satelit sebagai default
        satelitEsri.addTo(map);

        // 4. Siapkan Layer Group untuk Kontrol (Agar bisa dimatikan/dinyalakan)
        const layerBatasKIKN = L.layerGroup().addTo(map);
        const layerTitikPenting = L.layerGroup().addTo(map);

        // 5. Tambahkan Titik Lokasi Penting (Markers)
        // Icon Merah untuk Titik Nol
        const iconMerah = L.icon({
            iconUrl: 'https://cdn.rawgit.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });
        L.marker([-0.9729, 116.7088], {icon: iconMerah})
            .bindPopup("<div style='text-align:center;'><b>Titik Nol Nusantara</b><br>Referensi awal pembangunan IKN.</div>")
            .addTo(layerTitikPenting);

        // Icon Biru untuk Istana
        const iconBiru = L.icon({
            iconUrl: 'https://cdn.rawgit.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });
        L.marker([-0.9654, 116.7135], {icon: iconBiru})
            .bindPopup("<div style='text-align:center;'><b>Kawasan Istana Negara</b><br>Kawasan Inti Pusat Pemerintahan.</div>")
            .addTo(layerTitikPenting);

        // 6. Tambahkan Kontrol Layer ke Kanan Atas
        const baseMaps = {
            "Citra Satelit": satelitEsri,
            "Peta Jalan": petaJalan
        };
        const overlayMaps = {
            "Batas Wilayah": layerBatasKIKN,
            "Titik Penting": layerTitikPenting
        };
        L.control.layers(baseMaps, overlayMaps, { position: 'topright' }).addTo(map);

        // 7. Fungsi untuk mengambil dan memuat data GeoJSON batas KIKN
        async function muatBatasKIKN() {
            try {
                // Link raw GeoJSON dari repository GitHub
                const githubRawUrl = 'https://raw.githubusercontent.com/zahirahmad0905-blip/KIKN/main/KIKN.geojson.geojson';
                const response = await fetch(githubRawUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const dataGeoJSON = await response.json();

                // Tambahkan layer GeoJSON ke dalam layer group "layerBatasKIKN"
                const batasPolygon = L.geoJSON(dataGeoJSON, {
                    style: function (feature) {
                        return {
                            color: '#fbbf24', // Warna garis batas (Kuning)
                            weight: 3,
                            opacity: 1,
                            fillColor: '#fef08a',
                            fillOpacity: 0.15 
                        };
                    },
                    onEachFeature: function (feature, layer) {
                        layer.on({
                            mouseover: function(e) {
                                e.target.setStyle({ weight: 5, fillOpacity: 0.3 });
                            },
                            mouseout: function(e) {
                                batasPolygon.resetStyle(e.target);
                            }
                        });
                        layer.bindTooltip("<b>Area KIKN</b>", {sticky: true});
                    }
                }).addTo(layerBatasKIKN);

                // Arahkan kamera/zoom peta agar pas dengan batas area KIKN
                map.fitBounds(batasPolygon.getBounds(), { padding: [30, 30] });
                
            } catch (error) {
                console.error("Gagal memproses data GeoJSON.", error);
                
                // Tampilkan pesan error jika gagal memuat
                const mapDiv = document.getElementById('map');
                mapDiv.innerHTML += `
                    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 ui-overlay bg-white p-6 rounded-xl shadow-xl text-center">
                        <i class="fa-solid fa-triangle-exclamation text-4xl text-red-500 mb-3"></i>
                        <h2 class="text-xl font-bold text-slate-800">Gagal memuat batas KIKN</h2>
                        <p class="text-sm text-slate-600 mt-2">Periksa koneksi internet atau ketersediaan file di GitHub.</p>
                    </div>
                `;
            }
        }

        // Panggil fungsi saat website dimuat
        muatBatasKIKN();

    </script>
</body>
</html>
